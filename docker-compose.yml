services:
  postgres:
    image: postgres:17-alpine
    container_name: voltaluce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by the init script to create the two extra databases and roles.
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: ${GENERIC_TIMEZONE}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      # Named volume: data survives "docker compose down" (but not "down -v").
      - voltaluce_pgdata:/var/lib/postgresql/data
      # Scripts here run once, only when the data directory is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voltaluce_net

  n8n:
    # Pinned to the version verified with "n8n --version" on 2026-10-06.
    image: docker.n8n.io/n8nio/n8n:2.42.3
    container_name: voltaluce_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # n8n keeps its own tables in the "n8n" database, separate from the app data.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PORT: 5678
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      # Exposed to Code/expression nodes as $env.WEBHOOK_API_KEY.
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
    ports:
      - "${N8N_HOST_PORT}:5678"
    volumes:
      - voltaluce_n8n_data:/home/node/.n8n
    networks:
      - voltaluce_net

volumes:
  voltaluce_pgdata:
  voltaluce_n8n_data:

networks:
  voltaluce_net:
    driver: bridge
